<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- UN-100: locks pinch/double-tap zoom for a stable native-app feel on the
       installed app. Drew knowingly approved the WCAG 1.4.4 tradeoff on
       2026-08-07 for this private six-person league — do not re-litigate. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#500000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- UN-96: iOS reads this for the home-screen label — manifest.json's
       short_name is already "Pickems"; this brings the two into agreement. -->
  <meta name="apple-mobile-web-app-title" content="Pickems" />
  <meta name="description" content="Private college football pick'em league tracker" />
  <title>CFB Pickems</title>
  <!-- Stop browsers from serving a stale HTML shell from disk cache. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="manifest" href="manifest.json" />
  <!-- UN-96: iOS reads apple-touch-icon EXCLUSIVELY for the home-screen icon —
       it does not consult manifest icons for this. sizes="180x180" is the
       primary reference; the sizeless fallback below points at the same file
       for older iOS. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/styles.css?v=17-4" />
  <style>
    /* v14.1: Hide app shell until JS is ready so users don't see a flash of the
       maroon header before the PIN gate / dashboard renders. JS removes the
       `cfbp-booting` class on body once layout is decided. */
    body.cfbp-booting .page-wrapper { visibility: hidden; }
  </style>
</head>
<!-- UN-110: data-tab mirrors app.js navigateTo()'s active tab; set statically
     here (matching the hardcoded default-active #page-dashboard below) so
     there's no flash before JS runs navigateTo() for the first time. -->
<body class="cfbp-booting" data-tab="dashboard">

<!-- v0.16.0: Reveal-page PIN bypass. The CFP 2K26 reveal finale links to
     ?access=scribe — honor it by setting the SAME flag the real PIN gate sets
     (persistent, exactly like a successful PIN entry), then scrub the param so
     the URL players bookmark/share stays clean. Runs before the module loads
     so the gate never flashes. Access level: identical to knowing the PIN —
     appropriate here since the reveal link goes only to the six players and
     the reveal folder will be removed from the repo after launch. -->
<script>
  (function () {
    try {
      var p = new URLSearchParams(location.search);
      if (p.get('access') === 'scribe') {
        localStorage.setItem('cfbp_site_unlocked', '1');
        history.replaceState(null, '', location.pathname);
      }
    } catch (e) { /* non-fatal */ }
  })();
</script>

<!-- Inline theme bootstrap — runs before the module loads so users on a non-default
     theme don't see a flash of the wrong palette. Reads settings.theme directly.
     v0.17.4: default corrected 'aggie' -> 'neutral'. This bootstrap disagreed with
     storage.js getTheme() and app.js applyTheme(), which have both defaulted to
     'neutral' since v0.17.0 (UN-65, school palettes are opt-in) — so a fresh device
     flashed Aggie maroon for one frame before JS corrected it. Keep this literal in
     sync with getTheme()'s fallback; it cannot import. -->
<script>
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('cfbp_settings') || '{}');
      var key = (s && s.theme) || 'neutral';
      document.body.classList.add('theme-' + key);
    } catch (e) { /* fall back to default styles */ }
  })();
</script>

<div class="page-wrapper">

  <header class="app-header">
    <div class="app-header-inner">
      <!-- UN-108: #header-meta is the LEFT slot now (was inside .header-right,
           right-aligned, the bottom item of a 5-row vertical tower). Moved out
           to balance the header against the identity/sync/tz/theme cluster on
           the right. Keeps its id — refreshHeader() (js/app.js) targets it by
           id, so no JS change was needed. -->
      <div class="header-meta" id="header-meta"><strong>Loading…</strong></div>
      <div class="header-right">
        <!-- UN-106: identity is the most actionable header state, so it renders
             first. Empty + hidden until renderHeaderIdentity() (js/app.js) reads
             getSession() — never a flash of "Sign In" before session resolves. -->
        <button type="button" id="header-identity" class="header-identity" hidden></button>
        <span id="sync-badge" class="sync-badge"></span>
        <div id="tz-toggle" class="tz-toggle"></div>
        <div id="theme-toggle" class="theme-toggle-slot"></div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <!-- Default tab is DASHBOARD (per Phase I requirements UN-27).
         Other sections are inactive until navigated. -->
    <section class="page-section" id="page-picks">
      <div class="loading-state"><div class="spinner"></div><p>Loading…</p></div>
    </section>
    <section class="page-section active" id="page-dashboard">
      <div class="loading-state"><div class="spinner"></div><p>Loading…</p></div>
    </section>
    <section class="page-section" id="page-leaderboard">
      <div class="loading-state"><div class="spinner"></div><p>Loading…</p></div>
    </section>
    <section class="page-section" id="page-commissioner">

    </section>
    <section class="page-section" id="page-rules">
      <div class="loading-state"><div class="spinner"></div><p>Loading…</p></div>
    </section>
    <section class="page-section" id="page-chat">
      <div class="loading-state"><div class="spinner"></div><p>Loading…</p></div>
    </section>
  </main>

  <!-- UN-97: the six bottom-nav icons are the ONE named exception to "icons
       are unicode emoji" (CLAUDE.md, CONVENTIONS.md #16, approved 2026-08-07).

  <nav class="bottom-nav">

    </button>

<!-- Cache-bust the main entry script so a stale browser cache can't serve v9 app.js. -->
<script type="module" src="js/app.js?v=17-4"></script>
<script>
  // Service worker registration + auto-update.
  // When a new SW takes over (e.g. v10 replacing v9), force a one-time reload
  // so the user sees the new code instead of the cached v9 shell.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js?v=17-4')
        .then(reg => {
          console.log('[SW] registered:', reg.scope);
          // If there's already a waiting worker, tell it to activate now.
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          // Watch for new installations and tell them to take over.
          reg.addEventListener('updatefound', () => {
            const newSW = reg.installing;
            if (!newSW) return;
            newSW.addEventListener('statechange', () => {
              if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                newSW.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        })
        .catch(e => console.warn('[SW] failed', e));

      // When a new SW takes control mid-session, reload exactly once.
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      });
    });
  }
</script>
</body>
</html>
